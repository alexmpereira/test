<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de produtos com Bootstrap 5">
    <title>Catálogo de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <!-- Header -->
    <header class="bg-primary text-white py-4 mb-5">
        <div class="container">
            <h1 class="mb-0">📦 Catálogo de Produtos</h1>
            <p class="mb-0 text-white-50">Confira nossa seleção de produtos</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <ul id="lista-produtos" class="row lista-produtos">
            <!-- Produtos serão inseridos aqui via JavaScript -->
        </ul>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2024 Catálogo de Produtos. Todos os direitos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/produtos.js"></script>
</body>
</html>
